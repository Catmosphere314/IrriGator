# =============================================================================
# IrriGator — Parcel Configuration
# =============================================================================
# One file per parcel. Farmer-provided data overrides gridded defaults.
# Copy this template and fill in for each enrolled parcel.

parcel:
  id: "billac_001"
  name: "Parcelle Billac - SEP des Pouyades"
  farmer: "Edouard Truffaux"

  # Parcel geometry — either a centroid or a polygon file
  location:
    # Simple: centroid coordinates (WGS84)
    lat: 45.38383
    lon: 0.41508
    # Or: path to a GeoJSON/shapefile polygon for the parcel boundary
    # polygon_file: "data/parcels/24_bergerac_001.geojson"

  area_ha: 16.3

# =============================================================================
# Soil — farmer overrides (optional)
# =============================================================================
# If provided, these replace EU-SoilHydroGrids values for this parcel.
# Leave commented out to use gridded defaults.

soil:
  source: "eu_soilhydrogrids"  # "eu_soilhydrogrids" | "farmer_analysis" | "probe_calibrated"

  # Uncomment and fill if farmer has a soil analysis:
  # source: "farmer_analysis"
  # lab: "LAS Arras"
  # analysis_date: "2024-03-15"
  # layers:
  #   - depth_cm: [0, 30]
  #     sand_pct: 42.0
  #     silt_pct: 38.0
  #     clay_pct: 20.0
  #     organic_matter_pct: 2.1
  #     # If hydraulic properties known directly:
  #     # theta_fc: 0.29    # m³/m³
  #     # theta_wp: 0.13    # m³/m³
  #   - depth_cm: [30, 60]
  #     sand_pct: 38.0
  #     silt_pct: 35.0
  #     clay_pct: 27.0
  #     organic_matter_pct: 1.3
  #   - depth_cm: [60, 100]
  #     sand_pct: 35.0
  #     silt_pct: 30.0
  #     clay_pct: 35.0
  #     organic_matter_pct: 0.8

  # Uncomment if farmer has probe-derived field capacity:
  # source: "probe_calibrated"
  # theta_fc_measured: 0.31   # from drainage stabilization after heavy rain
  # theta_wp_estimated: 0.14  # from pedotransfer on texture + probe minimum
  # measurement_date: "2025-06-20"

  # Geology class (from BRGM or farmer knowledge)
  geology_class: "alluvium"  # alluvium | limestone_plateau | clay_limestone

# =============================================================================
# Crop — farmer inputs
# =============================================================================
crop:
  type: "grain_maize"

  # CRITICAL: farmer must provide these
  planting_date: "2025-04-14"
  expected_harvest: "2025-10-05"  # approximate, helps define season bounds

  # Variety and maturity group (Arvalis index)
  variety: "DKC4728"
  maturity_group: "G3"  # Very early to very late: A, B, C1, C2, D1, D2
  density: 86107 # seed/ha
  emergence_rate: 0.92 #assumed ??

  # GDD thresholds — defaults by maturity group, override if known
  # Leave commented to use defaults from configs/crop_parameters.yaml
  # gdd_thresholds:
  #   end_initial: 300
  #   end_development: 700
  #   end_midseason: 1300
  #   maturity: 1700

  gdd_thresholds:
    base: 6
    flowering: 970
    harvest: 1900



# =============================================================================
# Irrigation system
# =============================================================================
irrigation:
  system_type: "sprinkler"  # pivot | sprinkler | drip | flood
  # Application rate and constraints
  max_dose_mm: 50          # maximum per application
  min_dose_mm: 15          # minimum worthwhile application
  application_rate_mm_h: 8 # system flow rate
  # Minimum interval between irrigations (days)
  min_interval_days: 7
  # Irrigation window constraints (farmer's schedule)
  available_days: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday"]
  # Water access constraints (if applicable)
  # water_quota_mm_season: 2000  # some ASA impose seasonal limits

  # =============================================================================
# Irrigation history
# =============================================================================
irrigation_log:
  - date: "2025-06-10"
    amount_mm: 30
  - date: "2025-06-17"
    amount_mm: 32
  - date: "2025-06-24"
    amount_mm: 35
  - date: "2025-07-01"
    amount_mm: 38
  - date: "2025-07-08"
    amount_mm: 40
  - date: "2025-07-15"
    amount_mm: 15
  





# =============================================================================
# Monitoring — optional sensors
# =============================================================================
sensors:
  # Soil moisture probes
  probes: []
  # Example:
  # - type: "capacitance"
  #   model: "Sentek Drill&Drop"
  #   depths_cm: [10, 30, 50, 70, 90]
  #   data_file: "data/sensors/24_bergerac_001_probe.csv"
  #   data_format: "datetime,depth_cm,vwc"

  # Rain gauge on parcel
  rain_gauge: null
  # Example:
  # rain_gauge:
  #   data_file: "data/sensors/24_bergerac_001_rain.csv"
  #   data_format: "datetime,mm"

